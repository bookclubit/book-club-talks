<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TALK_TITLE}} — {{BOOK_TITLE}}</title>
    <meta name="description" content="{{OG_DESCRIPTION}}">
    <!-- Open Graph / соцсети -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{OG_TITLE}}">
    <meta property="og:description" content="{{OG_DESCRIPTION}}">
    <meta property="og:image" content="{{OG_IMAGE}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{OG_TITLE}}">
    <meta name="twitter:description" content="{{OG_DESCRIPTION}}">
    <meta name="twitter:image" content="{{OG_IMAGE}}">
    <!-- Тема до первой отрисовки: иначе светлый дек моргнёт тёмным. -->
    <script>
        try {
            if (localStorage.getItem('bc-deck-theme') === 'light')
                document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <!-- Локальные шрифты (Inter + JetBrains Mono), без внешних CDN -->
    <link rel="stylesheet" href="assets/css/fonts.css">
    <!-- Единый стиль дека (общий «хром» всех докладов) -->
    <link rel="stylesheet" href="assets/css/deck.css">
    <!-- Цвет книги (пишет генератор, таблица scripts/book-themes.mjs) -->
    <link rel="stylesheet" href="assets/css/theme.css">

</head>
<body data-hud="{{HUD_LABEL}}">
    <div class="progress" id="progressBar" style="width: 0%"></div>

    <div class="deck-viewport">
        <main class="deck-stage" id="deckStage">

            <!-- Открытие стрима, автор и книга — только в первом докладе вечера -->
            <!--OPENING_SLIDE-->
            <!--AUTHOR_SLIDE-->
            <!--BOOK_SLIDE-->

            <section class="slide fx" data-slide="4" data-chrome="agenda">
                <div class="timeline-next-container">
                    <div class="fx-kicker" data-rv="fade">Стрим {{STREAM}}</div>
                    <h2 class="fx-h" data-rv>Программа вечера</h2>
                    <!--AGENDA_ITEMS-->
                </div>
            </section>

            <!-- Титул доклада: глава, тема, кто читает и по какой книге.
                 В первом докладе вечера идёт после программы, в остальных — первым. -->
            <section class="slide fx is-title" data-slide="1" data-chrome="title">
                <div class="fx-wrap">
                    <div class="title-meta" data-rv="fade"><span>Книжный клуб</span><span>Стрим <b>{{STREAM}}</b></span></div>
                    <div class="fx-kicker" data-rv="fade"><span class="n">{{CHAPTER_LABEL}}</span>{{CHAPTER_TITLE}}</div>
                    <h1 class="title-h" data-rv>{{TALK_TITLE}}</h1>
                    <div class="title-bar"></div>
                    <div class="title-foot">
                        <!--SPEAKER_CARD-->
                        <!--TITLE_BOOK-->
                    </div>
                </div>
            </section>

            <!-- Здесь — контентные слайды доклада -->

            <section class="slide fx" data-slide="5" data-chrome="whatnext">
                <div class="timeline-next-container">
                    <div class="fx-kicker" data-rv="fade">Дальше</div>
                    <h2 class="fx-h" data-rv>Что далее</h2>
                    <!--WHATNEXT_ITEMS-->
                </div>
            </section>
</main>
    </div>

    


    <!-- Переключатель темы: светлая ↔ тёмная (клавиша T) -->
    <button class="theme-toggle" id="themeToggle" type="button" role="switch"
            aria-checked="false" aria-label="Переключить тему" title="Светлая тема (T)">
        <span class="theme-toggle-track">
            <span class="theme-toggle-knob"></span>
            <span class="theme-ico theme-ico-sun" aria-hidden="true">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
            </span>
            <span class="theme-ico theme-ico-moon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
            </span>
        </span>
    </button>

    <!-- Содержание: список слайдов, клик — переход на слайд (клавиша O) -->
    <button class="toc-toggle" id="tocToggle" type="button" aria-expanded="false"
            aria-controls="tocPanel" aria-label="Содержание презентации" title="Содержание (O)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"></path></svg>
    </button>
    <nav class="toc-panel" id="tocPanel" aria-label="Содержание презентации"></nav>

    <!-- Движок презентации: клавиатура, масштаб, появление блоков, заметки (N) -->
    <script src="assets/js/deck.js"></script>

</body>
</html>
